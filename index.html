<html lang="en">
<head>
<meta charset="utf-8">

<title>Bulk Sorter</title>
<style>
:root{
  --felt:#15231f; --panel:#1d302a; --line:#2c4439; --text:#e6efe9; --dim:#8fa89b;
  --gold:#f0b44c; --bad:#e2685a; --ok:#6fcf97;
  --font:"Avenir Next","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--felt);color:var(--text);font-family:var(--font);font-size:16px}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
button:active{background:var(--line)}
button.primary{background:var(--gold);color:#201a0a;border-color:var(--gold);font-weight:600}
button.small{padding:6px 10px;font-size:14px}
button.link{background:none;border:0;padding:2px 0;color:var(--gold);font-size:13px;text-align:left}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
nav{display:flex;border-bottom:1px solid var(--line)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 0;color:var(--dim);font-weight:600}
nav button[aria-selected=true]{color:var(--gold);box-shadow:inset 0 -3px 0 var(--gold)}
main{flex:1;overflow-y:auto;padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
section[hidden]{display:none}
#stage{position:relative;margin:0 auto;background:#000;border-radius:12px;overflow:hidden;width:100%;aspect-ratio:3/4;max-height:34dvh}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#guide{position:absolute;border:2px solid var(--gold);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.45);pointer-events:none}

.ctl select{flex:1.5;min-width:0}
details{margin:10px 0;color:var(--dim)}
summary{cursor:pointer;font-size:13px}

.cdTop{display:flex;gap:10px}.cdTop img{width:130px;border-radius:8px;align-self:flex-start}.cdInfo{flex:1;font-size:14px}
#cardBody{overflow-y:auto;max-height:68vh}
#tagBar{display:flex;gap:8px;align-items:center;margin-bottom:10px;color:var(--dim);font-size:13px}#tagBar span{flex:1}

<body>

<dialog id="pick">

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script type="module">
import { moveCard } from './moves.js';
import { findCard, warpCard, CARD_W, CARD_H } from './cardfind.js';
import { TAGS, tagLabel } from './tags.js';
import { norm, match as matchIn, textOverlap, fuse, Voter } from './matcher.js';
window.moveCard = moveCard; window.getStore = () => store; window.getTags = () => tagdb; // handy for poking at things from a console

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- storage (IndexedDB key/value) ---------- */
const idb = {
  db: null,
  open(){ return new Promise((res, rej) => { const r = indexedDB.open('bulksorter', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k){ const db = this.db ??= await this.open(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k, v){ const db = this.db ??= await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
};
// tiny element builder: h('div', {className:'x', onclick: fn}, child, child...)
const h = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };

/* store shape (this is what the JSON backup contains):
   { v, settings:{requireSet, target},
     bins:  { [binId]: {id, name, type:'storage'|'deck', icon} },
     cards: { [key]: {key, name, bins:{[binId]: qty}, added, confirmed, ...scryfall fields} } }
   A card's key is its name alone ("any printing") or `${name}|${set}|${collector number}` when a printing was chosen.
   moveCard() in moves.js takes that key. */
const ICONS = ['📦', '🗃️', '🧰', '🃏', '⚔️', '🧙', '🔥', '💧', '🌲', '⚡', '💀', '☀️', '⭐', '🏷️'];
let store = { v: 2, settings: { requireSet: false, target: 'bulk' }, bins: { bulk: { id: 'bulk', name: 'Bulk', type: 'storage', icon: '📦' } }, cards: {} };
function normalizeStore(){ // fills in anything an older save is missing
  store.v = 2;
  store.settings = { requireSet: false, target: 'bulk', ...(store.settings || {}) };
  store.bins ??= {}; store.cards ??= {};
  if (!Object.keys(store.bins).length) store.bins.bulk = { id: 'bulk', name: 'Bulk', type: 'storage', icon: '📦' };
  for (const b of Object.values(store.bins)){ b.type ??= 'storage'; b.icon ??= b.type === 'deck' ? '🃏' : '📦'; }
  for (const [k, c] of Object.entries(store.cards)) c.key ??= k; // older saves keyed cards by name only
  if (!store.bins[store.settings.target]) store.settings.target = Object.keys(store.bins)[0];
}
let saveTimer = null;
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(() => idb.set('store', store), 300); }
const totalQty = c => Object.values(c.bins).reduce((a, b) => a + b, 0);
const money = p => p == null ? null : '$' + p.toFixed(2);
const keyOf = (name, p) => p ? `${name}|${p.set}|${p.collector_number ?? p.cn}` : name;
const curBin = () => store.bins[store.settings.target] ? store.settings.target : Object.keys(store.bins)[0];
let lastSet = null; // set code of the last printing you picked: offered first next time

/* ---------- card name catalog + fuzzy match ---------- */
let index = [];
const match = raw => matchIn(raw, index);

async function loadCatalog(){
  let c = await idb.get('catalog');
  if (!c || Date.now() - c.t > 14 * 864e5){
    try {
      const r = await fetch('https://api.scryfall.com/catalog/card-names');
      const j = await r.json();
      c = { t: Date.now(), data: j.data };
      await idb.set('catalog', c);
    } catch (e) { if (!c) throw e; }
  }
  index = [];
  for (const name of c.data){
    if (/^A-/.test(name) || name.length > 150) continue; // skip digital-only Alchemy rebalances
    index.push({ name, norm: norm(name) });
    if (name.includes(' // ')) index.push({ name, norm: norm(name.split(' // ')[0]) });
  }
}

function suggest(raw){
  const q = norm(raw);
  if (q.length < 2) return [];
  const hits = new Set();
  for (const e of index){ if (e.norm.includes(q)){ hits.add(e.name); if (hits.size >= 6) break; } }
  return hits.size ? [...hits] : match(raw).map(m => m.name);
}

/* ---------- collection actions ---------- */
let lastAdded = null; // {key, bin}
// add copies of a card to a bin. Pass `printing` (a Scryfall card object) to file it under that exact printing.
function addCard(name, { qty = 1, bin = curBin(), printing = null, key = null } = {}){
  key ??= keyOf(name, printing);
  let c = store.cards[key];
  if (!c){
    c = store.cards[key] = { key, name, bins: {}, added: Date.now() };
    if (printing){ applyPrinting(c, printing); c.confirmed = true; }
  }
  if (printing) lastSet = printing.set;
  c.bins[bin] = (c.bins[bin] || 0) + qty;
  lastAdded = { key, bin };
  navigator.vibrate?.(30);
  save(); renderBar(); renderList(); enqueue(key);
  return key;
}
function removeOne(key, bin){
  const c = store.cards[key]; if (!c) return;
  c.bins[bin] = (c.bins[bin] || 0) - 1;
  if (c.bins[bin] <= 0) delete c.bins[bin];
  if (totalQty(c) === 0) delete store.cards[key];
  save(); renderBar(); renderList();
}
// the one door every scan / tap / typed name goes through: asks which printing first if "By set" is on
async function requestAdd(name, bin = curBin()){
  if (!store.settings.requireSet) return addCard(name, { bin });
  const p = await pickPrinting({ name, allowAny: true, note: `Adding to ${store.bins[bin]?.name ?? 'collection'}. Which printing is it?` });
  if (p == null) return null; // cancelled: nothing added
  return addCard(name, { bin, printing: p === 'any' ? null : p });
}
function renderBar(){
  const bar = $('#bar');
  const c = lastAdded && store.cards[lastAdded.key];
  if (!c){ bar.style.display = 'none'; lastAdded = null; return; }
  bar.style.display = 'flex';
  const where = store.bins[lastAdded.bin]?.name ?? '?';
  $('#barText').textContent = `${c.name}${c.confirmed ? ' (' + c.set.toUpperCase() + ')' : ''} → ${where}, now ${c.bins[lastAdded.bin] || 0}`;
}
$('#barText').onclick = () => lastAdded && openCard(lastAdded.key);
$('#plus').onclick = () => { const c = lastAdded && store.cards[lastAdded.key]; if (c) addCard(c.name, { key: c.key, bin: lastAdded.bin }); };
$('#undo').onclick = () => { if (lastAdded) removeOne(lastAdded.key, lastAdded.bin); };

/* ---------- Scryfall details: printing, art, price ---------- */
function applyPrinting(c, j){
  const f = j.card_faces?.[0], im = j.image_uris ?? f?.image_uris ?? {}, p = j.prices || {};
  const usd = p.usd ?? p.usd_foil ?? p.usd_etched ?? null;
  Object.assign(c, {
    id: j.id, oracle_id: j.oracle_id ?? f?.oracle_id, type_line: j.type_line, cmc: j.cmc ?? 0,
    mana_cost: j.mana_cost ?? f?.mana_cost ?? '', colors: j.colors ?? f?.colors ?? [],
    img: im.small ?? '', imgN: im.normal ?? '', art: im.art_crop ?? '',
    set: j.set, set_name: j.set_name, cn: j.collector_number,
    price: usd == null ? null : Number(usd), foilOnly: p.usd == null && usd != null, priceAt: Date.now()
  });
  delete c.err;
  tagWant(c.oracle_id);
}

const queue = []; let running = false;
function enqueue(key){ const c = store.cards[key]; if (c && !c.id && c.err !== 404 && !queue.includes(key)){ queue.push(key); runQueue(); } }
async function runQueue(){
  if (running) return; running = true;
  while (queue.length){
    const key = queue.shift(), c = store.cards[key]; if (!c) continue;
    try {
      const r = await fetch('https://api.scryfall.com/cards/named?exact=' + encodeURIComponent(c.name));
      if (r.ok) applyPrinting(c, await r.json()); else c.err = r.status;
    } catch (e) { c.err = 'offline'; }
    save(); renderList();
    await sleep(120);
  }
  running = false;
}
// Scryfall asks that prices not be older than a day, so refresh stale ones in batches of 75
async function refreshPrices(){
  const byId = new Map();
  for (const c of Object.values(store.cards)) if (c.id && Date.now() - (c.priceAt || 0) > 864e5) (byId.get(c.id) ?? byId.set(c.id, []).get(c.id)).push(c);
  const ids = [...byId.keys()];
  for (let i = 0; i < ids.length; i += 75){
    try {
      const r = await fetch('https://api.scryfall.com/cards/collection', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ identifiers: ids.slice(i, i + 75).map(id => ({ id })) }) });
      if (!r.ok) break;
      for (const card of (await r.json()).data) for (const c of byId.get(card.id) || []) applyPrinting(c, card);
      save(); renderList();
    } catch (e) { break; }
    await sleep(150);
  }
}

/* ---------- functional tags (Scryfall otag), cached per card; see tags.js ---------- */
let tagdb = { byOracle: {} }; // oracle id -> {tags, at, sig}. Saved separately from the collection, and included in the JSON backup.
const SIG = TAGS.join(','); // when tags.js changes, every card is re-checked
const want = new Set(), force = new Map(); // force: oracle id -> its tags before a manual re-check
let tagRunning = false, tagStop = false, refreshing = false, tagTimer = null;
let tagFile = null, fileReport = ''; // tags.json (built by build_tags.py): {generated, complete, covered?, tags:{slug:{label}}, cards:{oracle_id:[slug]}}
async function loadTagFile(){
  try {
    const r = await fetch('tags.json', { cache: 'no-cache' });
    if (!r.ok) return false;
    const j = await r.json();
    tagFile = { generated: j.generated, complete: !!j.complete, covered: j.covered ? new Set(j.covered) : null, tags: j.tags || {}, cards: j.cards || {} };
    return true;
  } catch (e) { return false; } // missing or offline: keep whatever we had
}
const fileCovers = id => !!tagFile && (tagFile.complete || !!tagFile.covered?.has(id));
const tagsOf = id => fileCovers(id) ? (tagFile.cards[id] ?? []) : (tagdb.byOracle[id]?.tags ?? []);

function tagWant(id){ if (!id || fileCovers(id)) return; const e = tagdb.byOracle[id]; if (!e || e.sig !== SIG){ want.add(id); runTags(); } }
// for each batch of ~12 cards, one query per tag: "(oracleid:a OR oracleid:b ...) otag:ramp" returns just the cards that have it
async function runTags(){
  if (tagRunning) return; tagRunning = true; tagStop = false; renderTagStat();
  const changes = [], hitTags = new Set(); let processed = 0, ok = true;
  while (want.size && !tagStop && ok){
    const ids = [...want].slice(0, 12), found = new Map(ids.map(i => [i, []]));
    for (const tag of TAGS){
      if (tagStop){ ok = false; break; }
      const q = `(${ids.map(i => 'oracleid:' + i).join(' OR ')}) otag:${tag}`;
      let hits = null;
      for (let a = 0; a < 3 && hits === null; a++){
        try {
          const r = await fetch('https://api.scryfall.com/cards/search?unique=cards&q=' + encodeURIComponent(q));
          if (r.status === 404) hits = [];
          else if (r.status === 429) await sleep(2000);
          else if (r.ok) hits = (await r.json()).data.map(c => c.oracle_id ?? c.card_faces?.[0]?.oracle_id);
          else break;
        } catch (e) { await sleep(1000); }
        await sleep(110);
      }
      if (hits === null){ ok = false; break; }
      if (hits.length) hitTags.add(tag);
      for (const o of hits) found.get(o)?.push(tag);
    }
    if (!ok) break;
    for (const id of ids){
      tagdb.byOracle[id] = { tags: found.get(id), at: Date.now(), sig: SIG }; want.delete(id); processed++;
      if (force.has(id)){
        const a = new Set(force.get(id)), b = new Set(found.get(id)), plus = [...b].filter(t => !a.has(t)), minus = [...a].filter(t => !b.has(t));
        if (plus.length || minus.length) changes.push({ id, plus, minus });
        force.delete(id);
      }
    }
    saveTags(); renderList(); renderTagStat();
  }
  tagRunning = false; renderTagStat();
  if (ok && refreshing && !want.size){
    refreshing = false;
    const name = id => Object.values(store.cards).find(c => c.oracle_id === id)?.name ?? id;
    let t = (fileReport ? fileReport + '\n\n' : '') + `Re-checked ${processed} cards live.\n` + (changes.length ? changes.map(c => `\n${name(c.id)}: ${[...c.plus.map(x => '+' + x), ...c.minus.map(x => '−' + x)].join(' ')}`).join('') : 'No tags changed.');
    const dead = TAGS.filter(x => !hitTags.has(x));
    if (processed >= 30 && dead.length) t += `\n\nMatched none of these cards (misspelled in tags.js, or just unused here): ${dead.join(', ')}`;
    fileReport = ''; $('#repText').textContent = t; $('#repDlg').showModal();
  }
}
function renderTagStat(){
  const ids = new Set(Object.values(store.cards).map(c => c.oracle_id).filter(Boolean));
  let live = 0, liveDone = 0;
  for (const id of ids) if (!fileCovers(id)){ live++; if (tagdb.byOracle[id]?.sig === SIG) liveDone++; }
  const src = tagFile ? `Tags from tags.json${tagFile.generated ? ' (' + tagFile.generated.slice(0, 10) + ')' : ''}` : 'Tags: live checks (no tags.json found)';
  const liveTxt = live ? `${tagFile ? ' · ' : ': '}${liveDone}/${live} cards checked live${tagRunning ? ', working…' : want.size ? ', paused (offline?)' : ''}` : '';
  $('#tagStat').textContent = !ids.size ? 'Tags show up once card details have loaded.' : tagFile ? src + liveTxt : src + (live ? ` · ${liveDone}/${live} checked${tagRunning ? ', working…' : want.size ? ', paused (offline?)' : ''}` : '');
  $('#tagRefresh').textContent = tagRunning ? 'Stop' : tagFile ? 'Reload tags' : coll.view === 'bin' && coll.bin !== 'all' ? 'Re-check this folder' : 'Re-check tags';
}
$('#tagRefresh').onclick = async () => {

    const changes = [];

      const a = new Set(before.get(id)), b = new Set(tagsOf(id)), plus = [...b].filter(t => !a.has(t)), minus = [...a].filter(t => !b.has(t));
      if (plus.length || minus.length) changes.push(`${nameOf(id)}: ${[...plus.map(x => '+' + x), ...minus.map(x => '−' + x)].join(' ')}`);

  }

function similar(c, sel){
  const base = new Set(tagsOf(c.oracle_id)), seen = new Map();
  for (const o of Object.values(store.cards)){
    if (!o.oracle_id || o.oracle_id === c.oracle_id) continue;
    const t = tagsOf(o.oracle_id), shared = t.filter(x => base.has(x));
    if (!shared.length || [...sel].some(x => !t.includes(x))) continue;
    const e = seen.get(o.oracle_id) ?? seen.set(o.oracle_id, { rep: o, shared, bins: {} }).get(o.oracle_id);
    for (const [b, n] of Object.entries(o.bins)) e.bins[b] = (e.bins[b] || 0) + n;
  }
  return [...seen.values()].sort((a, b) => b.shared.length - a.shared.length || a.rep.name.localeCompare(b.rep.name)).slice(0, 60);
}
const where = bins => Object.entries(bins).map(([b, n]) => `${store.bins[b]?.icon ?? ''} ${store.bins[b]?.name ?? b} ×${n}`).join('   ');

/* printing picker: resolves with a Scryfall card (the printing), 'any', or null if cancelled */
let pickResolve = null;
function finish(v){ const r = pickResolve; pickResolve = null; if ($('#pick').open) $('#pick').close(); if (r) r(v); }
$('#pickClose').onclick = () => finish(null);
$('#pickAny').onclick = () => finish('any');
$('#pick').addEventListener('close', () => { if (pickResolve) finish(null); });
function pickPrinting({ name, oracleId, note = '', allowAny = false, currentId = null }){
  return new Promise(resolve => {
    if (pickResolve) finish(null);
    pickResolve = resolve;
    const dlg = $('#pick'), box = $('#pickList');
    $('#pickTitle').textContent = name; $('#pickNote').textContent = note; $('#pickAny').hidden = !allowAny; box.textContent = 'Loading printings…';
    dlg.showModal();
    (async () => {
      try {
        const q = (oracleId ? 'oracleid:' + oracleId : `!"${name.replace(/"/g, '')}"`) + ' game:paper';
        const r = await fetch('https://api.scryfall.com/cards/search?q=' + encodeURIComponent(q) + '&unique=prints&order=released&dir=desc');
        const j = await r.json();
        if (pickResolve !== resolve) return; // cancelled while loading
        if (!j.data?.length) throw new Error('none');
        if (j.data.length === 1 && allowAny){ finish(j.data[0]); return; } // only one printing exists: nothing to confirm
        const list = [...j.data].sort((a, b) => (b.set === lastSet) - (a.set === lastSet)); // same set as the last card first
        box.textContent = '';
        for (const p of list){
          const f = p.card_faces?.[0], im = p.image_uris ?? f?.image_uris ?? {}, pr = p.prices || {};
          const price = money(pr.usd != null ? Number(pr.usd) : pr.usd_foil != null ? Number(pr.usd_foil) : null);
          const meta = [price ?? 'no price', pr.usd == null && pr.usd_foil != null ? 'foil only' : '', p.rarity, p.set === lastSet ? 'same set as last card' : '', p.id === currentId ? 'current' : ''].filter(Boolean).join(' · ');
          box.append(h('button', { className: 'pk' + (p.id === currentId ? ' cur' : ''), onclick: () => finish(p) },
            h('img', { src: im.small ?? '', alt: '', loading: 'lazy' }),
            h('div', { className: 't' }, h('div', { textContent: `${p.set_name} (${p.set.toUpperCase()}) #${p.collector_number}` }), h('div', { textContent: meta }))));
        }
        if (j.has_more) box.append(h('div', { className: 'hint', textContent: 'Showing the 175 most recent printings.' }));
      } catch (e) { if (pickResolve === resolve) box.textContent = 'Could not load printings. Check your connection.'; }
    })();
  });
}
// change the printing of an existing card (all its copies move to the new printing's record)
async function changePrinting(key){
  const c = store.cards[key]; if (!c) return;
  const p = await pickPrinting({ name: c.name, oracleId: c.oracle_id, currentId: c.id, note: `Applies to all ${totalQty(c)} copies.` });
  if (!p || p === 'any') return;
  const nk = keyOf(c.name, p);
  if (nk === key){ applyPrinting(c, p); c.confirmed = true; }
  else {
    let t = store.cards[nk];
    if (!t){ t = store.cards[nk] = { key: nk, name: c.name, bins: {}, added: c.added }; applyPrinting(t, p); t.confirmed = true; }
    for (const [b, q] of Object.entries(c.bins)) t.bins[b] = (t.bins[b] || 0) + q;
    delete store.cards[key];
    if (lastAdded?.key === key) lastAdded.key = nk;
  }
  lastSet = p.set; save(); renderList(); renderBar();
}

function csv(scope){
  const esc = s => `"${String(s ?? '').replace(/"/g, '""')}"`;
  const lines = ['Quantity,Name,Bin,Type,Set,Collector number,Price USD,Oracle ID,Scryfall ID,Tags'];
  for (const c of rowsFor(scope)) for (const [b, q] of Object.entries(c.bins)) if (scope === 'all' || b === scope)
    lines.push([q, esc(c.name), esc(store.bins[b]?.name || b), esc(c.type_line), esc((c.set || '').toUpperCase()), esc(c.cn), c.price ?? '', esc(c.oracle_id), esc(c.id), esc(tagsOf(c.oracle_id).join(';'))].join(','));
  download(scope === 'all' ? 'collection.csv' : `${(store.bins[scope]?.name || 'collection').replace(/\W+/g, '_')}.csv`, lines.join('\n'), 'text/csv');
}
$('#copyAll').onclick = () => copyText('all'); $('#csvAll').onclick = () => csv('all');
$('#copyList').onclick = () => copyText(coll.bin); $('#dlCsv').onclick = () => csv(coll.bin);
$('#dlJson').onclick = () => download('bulk-sorter-backup.json', JSON.stringify({ ...store, tagdb }), 'application/json');
$('#restore').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (!j.cards || !j.bins) throw new Error('bad file');
    if (!confirm('Replace your current collection with this backup?')) return;
    if (j.tagdb){ tagdb = j.tagdb; tagdb.byOracle ??= {}; saveTags(); delete j.tagdb; }
    store = j; normalizeStore(); save(); openGrid(); renderBar(); renderTarget(); syncToggle(); Object.keys(store.cards).forEach(enqueue); Object.values(store.cards).forEach(c => tagWant(c.oracle_id)); refreshPrices();
  } catch { alert('That file is not a Bulk Sorter backup.'); }
  e.target.value = '';
};

/* ---------- camera ---------- */
const video = $('#video'), stage = $('#stage'), guide = $('#guide'), overlay = $('#overlay'), cropCv = $('#crop');
let stream = null, track = null, caps = {}, worker = null, busy = false, catalogReady = false;
const CARD_AR = 63 / 88;
function setStatus(t){ $('#status').textContent = t; }

function geo(){
  const W = stage.clientWidth, H = stage.clientHeight;
  const gh = Math.min(H * 0.92, W * 0.92 / CARD_AR), gw = gh * CARD_AR;
  return { W, H, gw, gh, gx: (W - gw) / 2, gy: (H - gh) / 2 };
}
function layout(){
  if (video.videoWidth){
    const ar = video.videoWidth / video.videoHeight;
    stage.style.aspectRatio = ar;
    stage.style.width = `min(100%, ${34 * ar}dvh)`;
  }
  const g = geo();
  Object.assign(guide.style, { left: g.gx + 'px', top: g.gy + 'px', width: g.gw + 'px', height: g.gh + 'px' });
  overlay.width = stage.clientWidth; overlay.height = stage.clientHeight;
}
addEventListener('resize', layout);

async function startCam(){
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    video.srcObject = stream; await video.play();
    track = stream.getVideoTracks()[0]; caps = track.getCapabilities?.() || {};
    const adv = {}, on = [];
    for (const [k, v, label] of [['focusMode', 'continuous', 'focus'], ['exposureMode', 'continuous', 'exposure'], ['whiteBalanceMode', 'continuous', 'white balance']]){
      if (caps[k]?.includes?.(v)){ adv[k] = v; on.push(label); }
    }
    if (on.length){ try { await track.applyConstraints({ advanced: [adv] }); } catch { on.length = 0; } }
    $('#camNote').textContent = `Camera ${video.videoWidth}×${video.videoHeight}. ` + (on.length ? `Auto ${on.join(', ')} on. Tap the picture to refocus.` : 'This browser does not expose focus controls, so the phone focuses on its own. Hold the card a hand-width or more from the lens.');
    $('#camOff').style.display = 'none';
    layout(); updateScanBtn();
  } catch (e) {
    $('#camOff').firstElementChild.textContent = 'Camera blocked or unavailable (' + e.name + '). Allow camera access for this site, and make sure it is loaded over https.';
  }
}
$('#camBtn').onclick = startCam;
stage.addEventListener('click', async () => { // tap to refocus where the browser allows it
  if (!track || !caps.focusMode?.includes?.('single-shot')) return;
  try { await track.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] }); await sleep(900); if (caps.focusMode.includes('continuous')) await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch {}
});
const updateScanBtn = () => { $('#scanBtn').disabled = !(stream && catalogReady); };

/* ---------- card detection (OpenCV.js, loaded in the background) ---------- */
let cv = null;
const loadScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.append(s); });
async function loadCV(){
  try {
    await loadScript('https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.11.0-release.1/dist/opencv.js');
    let c = window.cv;
    if (c && typeof c.then === 'function') c = await c;
    if (!c.Mat) await new Promise(r => { c.onRuntimeInitialized = r; });
    cv = c; cvStatus = 'ready';
  } catch (e) { cvStatus = 'unavailable'; }
}
let cvStatus = 'loading';

function sharpness(canvas){ // variance of the Laplacian on a small copy: higher means sharper
  const w = 320, h = Math.max(8, Math.round(320 * canvas.height / canvas.width));
  const t = sharpness.c ??= document.createElement('canvas'); t.width = w; t.height = h;
  const x = t.getContext('2d', { willReadFrequently: true }); x.drawImage(canvas, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h).data, g = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) g[i] = d[i * 4] * 0.3 + d[i * 4 + 1] * 0.59 + d[i * 4 + 2] * 0.11;
  let sum = 0, sq = 0, n = 0;
  for (let y = 1; y < h - 1; y++) for (let xx = 1; xx < w - 1; xx++){
    const i = y * w + xx, l = 4 * g[i] - g[i - 1] - g[i + 1] - g[i - w] - g[i + w];
    sum += l; sq += l * l; n++;
  }
  const m = sum / n; return sq / n - m * m;
}
async function grabBestFrame(n = 3){ // a few quick frames, keep the sharpest
  let best = null;
  for (let i = 0; i < n; i++){
    const c = document.createElement('canvas'); c.width = video.videoWidth; c.height = video.videoHeight;
    c.getContext('2d').drawImage(video, 0, 0);
    const s = sharpness(c); if (!best || s > best.s) best = { c, s };
    if (i < n - 1) await sleep(70);
  }
  return best;
}

function detect(frame){ // card outline -> flattened upright card canvas
  if (!cv) return null;
  const src = cv.imread(frame);
  try {
    const quad = findCard(cv, src); if (!quad) return null;
    const w = warpCard(cv, src, quad), wc = document.createElement('canvas');
    cv.imshow(wc, w); w.delete();
    return { quad, warp: wc };
  } finally { src.delete(); }
}
function guideWarp(frame){ // fallback: the card is assumed to sit inside the on-screen guide
  const g = geo(), k = frame.width / g.W, wc = document.createElement('canvas');
  wc.width = CARD_W; wc.height = CARD_H;
  wc.getContext('2d').drawImage(frame, g.gx * k, g.gy * k, g.gw * k, g.gh * k, 0, 0, CARD_W, CARD_H);
  return wc;
}
let overlayTimer = null;
function drawOverlay(quad){
  const ctx = overlay.getContext('2d'); ctx.clearRect(0, 0, overlay.width, overlay.height);
  clearTimeout(overlayTimer);
  if (!quad) return;
  const k = stage.clientWidth / video.videoWidth;
  ctx.strokeStyle = '#6fcf97'; ctx.lineWidth = 3; ctx.beginPath();
  quad.forEach((p, i) => i ? ctx.lineTo(p.x * k, p.y * k) : ctx.moveTo(p.x * k, p.y * k));
  ctx.closePath(); ctx.stroke();
  overlayTimer = setTimeout(() => ctx.clearRect(0, 0, overlay.width, overlay.height), 1500);
}

// OCR works on small, high-contrast crops of an upright (flattened) card. crop = [x0, x1, y0, y1] as fractions of the card.
// Tight crops read some cards better and wide crops read others better, so we try several and keep the best match.
const TITLE_CROPS = [[.04, .78, .03, .115], [.09, .80, .062, .105], [.085, .80, .05, .115]];
const TEXT_CROP = [.07, .93, .62, .90];
const USE_TEXT_CHECK = true; // second opinion from the rules text; set false to turn it off

function flipCanvas(c){
  const o = document.createElement('canvas'); o.width = c.width; o.height = c.height;
  const x = o.getContext('2d'); x.translate(o.width, o.height); x.rotate(Math.PI); x.drawImage(c, 0, 0);
  return o;
}
function prepRegion(src, [x0, x1, y0, y1], { invert = false, targetH = 120, maxScale = 4, scale: fixed, pct = 5 } = {}){
  const sx = CARD_W * x0, sy = CARD_H * y0, sw = CARD_W * (x1 - x0), sh = CARD_H * (y1 - y0);
  const scale = fixed ?? Math.min(maxScale, Math.max(1, targetH / sh)), w = Math.round(sw * scale), h = Math.round(sh * scale), pad = 14;
  const t = document.createElement('canvas'); t.width = w; t.height = h;
  const tc = t.getContext('2d', { willReadFrequently: true });
  tc.imageSmoothingQuality = 'high';
  tc.drawImage(src, sx, sy, sw, sh, 0, 0, w, h);
  const img = tc.getImageData(0, 0, w, h), d = img.data, hist = new Uint32Array(256);
  for (let i = 0; i < d.length; i += 4){ const y = (d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11) | 0; d[i] = y; hist[y]++; }
  const cut = w * h * pct / 100; let acc = 0, lo = 0, hi = 255;
  for (let v = 0; v < 256; v++){ acc += hist[v]; if (acc > cut){ lo = v; break; } }
  acc = 0; for (let v = 255; v >= 0; v--){ acc += hist[v]; if (acc > cut){ hi = v; break; } }
  const span = Math.max(40, hi - lo);
  for (let i = 0; i < d.length; i += 4){
    let y = Math.max(0, Math.min(255, ((d[i] - lo) * 255) / span));
    if (invert) y = 255 - y;
    d[i] = d[i + 1] = d[i + 2] = y; d[i + 3] = 255;
  }
  tc.putImageData(img, 0, 0);
  const out = document.createElement('canvas'); out.width = w + pad * 2; out.height = h + pad * 2;
  const oc = out.getContext('2d'); oc.fillStyle = '#fff'; oc.fillRect(0, 0, out.width, out.height); oc.drawImage(t, pad, pad);
  return out;
}

async function getWorker(){
  if (worker) return worker;
  setStatus('Loading text reader (first time downloads about 10 MB)…');
  worker = await Tesseract.createWorker('eng', 1, {});
  await worker.setParameters({ tessedit_pageseg_mode: '7' });
  return worker;
}

/* second opinion: Scryfall's rules text for the top candidates vs the text printed on the card */
const details = new Map(); // card name -> type line + rules text, or null if unavailable
async function fetchDetails(names){
  const need = names.filter(n => !details.has(n));
  if (!need.length) return;
  try {
    const r = await fetch('https://api.scryfall.com/cards/collection', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ identifiers: need.map(name => ({ name })) }) });
    if (r.ok) for (const c of (await r.json()).data || []) details.set(c.name, [c.type_line, ...(c.card_faces || [c]).map(f => f.oracle_text || '')].join(' '));
  } catch (e) { /* offline: skip the check */ }
  for (const n of need) if (!details.has(n)) details.set(n, null);
}
async function textCheck(cands, upright, w){
  const top = cands.slice(0, 5);
  await fetchDetails(top.map(c => c.name));
  await w.setParameters({ tessedit_pageseg_mode: '6' });
  const { data } = await w.recognize(prepRegion(upright, TEXT_CROP, { scale: 2.5, pct: 3 }));
  await w.setParameters({ tessedit_pageseg_mode: '7' });
  const ranked = top.map(c => { const d = details.get(c.name), ov = d ? textOverlap(data.text, d) : null; return { name: c.name, score: fuse(c.score, ov) }; });
  return { text: data.text, cands: ranked.sort((a, b) => b.score - a.score) };
}

// opts.auto: called from the auto loop (skip frames with no card in them, don't touch the status line)
async function scanOnce(opts = {}){
  if (busy || !stream || !catalogReady) return null;
  busy = true; $('#scanBtn').disabled = true;
  try {
    const w = await getWorker();
    const frame = await grabBestFrame(3);
    const det = detect(frame.c);
    drawOverlay(det?.quad);
    guide.style.display = det ? 'none' : 'block';
    if (!det && opts.auto && cv) return { cands: [], det: false };
    const warp = det ? det.warp : guideWarp(frame.c);
    let flipped = null, best = null, tries = 0;
    const plan = [[0, false, false], [1, false, false], [2, false, false], [0, true, false], [1, true, false], [0, false, true], [1, false, true], [0, true, true]];
    for (const [ci, inv, flip] of plan){
      if (best && (best.score >= 0.9 || (best.score >= 0.8 && tries >= 2))) break;
      const upright = flip ? (flipped ??= flipCanvas(warp)) : warp;
      const c = prepRegion(upright, TITLE_CROPS[ci], { invert: inv });
      const { data } = await w.recognize(c);
      const text = data.text.trim().replace(/\s+/g, ' '), cands = match(text), score = cands[0]?.score || 0;
      tries++;
      if (!best || score > best.score) best = { score, text, cands, inv, flip, canvas: c };
    }
    let cands = best.cands, checked = false;
    if (USE_TEXT_CHECK && cands.length && cands[0].score >= 0.5 && (cands[0].score < 0.9 || (cands[1] && cands[0].score - cands[1].score < 0.15))){
      try { cands = (await textCheck(cands, best.flip ? (flipped ??= flipCanvas(warp)) : warp, w)).cands; checked = true; } catch (e) { /* keep title-only scores */ }
    }
    cropCv.width = best.canvas.width; cropCv.height = best.canvas.height; cropCv.getContext('2d').drawImage(best.canvas, 0, 0);
    const tags = [det ? 'outline found' : cv ? 'no outline, used guide box' : `detector ${cvStatus}, used guide box`, best.inv ? 'inverted' : '', best.flip ? 'upside down' : '', checked ? 'text checked' : '', tries + ' reads', 'sharpness ' + Math.round(frame.s)].filter(Boolean).join(', ');
    $('#ocrText').textContent = (best.text ? `Read "${best.text}"` : 'Read nothing') + ` (${tags})`;
    if (!opts.auto) setStatus(cands.length ? 'Tap the right card.' : det ? 'Found a card but could not read its name. Try more light or less glare.' : 'No card found. Put it on a plain, contrasting surface, or line the name up with the dashed box.');
    return { cands, det: !!det, text: best.text };
  } catch (e) {
    setStatus('Scan failed: ' + e.message); return null;
  } finally { busy = false; updateScanBtn(); }
}
function renderCands(cands){
  const box = $('#cands'); box.textContent = '';
  cands.slice(0, 5).forEach((c, i) => {
    const b = document.createElement('button'); if (i === 0 && c.score >= 0.8) b.className = 'top';
    const a = document.createElement('span'), s = document.createElement('span');
    a.textContent = c.name; s.textContent = Math.round(c.score * 100) + '%'; s.style.color = 'var(--dim)';
    b.append(a, s); b.onclick = () => { voter.clear(); box.textContent = ''; requestAdd(c.name); };
    box.append(b);
  });
}
$('#scanBtn').onclick = async () => { const r = await scanOnce(); if (r) renderCands(r.cands); };

/* auto mode: decide from a few recent scans, not one frame. Adds on one very confident read, or on repeated decent reads
   (they don't have to be back to back). After an add it waits for the card to leave the frame, or a different card to read clearly. */
const voter = new Voter(5000);
let autoOn = false, locked = null, absent = 0;
$('#auto').onchange = e => { autoOn = e.target.checked; locked = null; absent = 0; voter.clear(); if (autoOn) autoLoop(); };
async function autoLoop(){
  while (autoOn){
    if (!stream || !catalogReady){ await sleep(500); continue; }
    const res = await scanOnce({ auto: true });
    if (res){
      const top = res.cands[0];
      if (locked){
        absent = (cv ? !res.det : !top) ? absent + 1 : 0;
        if (absent >= 2 || (top && top.score >= 0.85 && top.name !== locked)){ locked = null; absent = 0; voter.clear(); }
      }
      if (!locked){
        if (!res.det && cv){ setStatus('Looking for a card…'); }
        else {
          const lead = voter.display(1)[0];
          if (top && top.score >= 0.9 && lead && lead.name !== top.name) voter.clear(); // clearly a new card
          voter.push(res.cands);
          const pick = voter.decide(res.cands);
          if (pick){ locked = pick; voter.clear(); renderCands([]); setStatus(`Adding ${pick}…`); const k = await requestAdd(pick); setStatus(k ? `Added ${pick}. Swap the card to scan the next one.` : 'Not added. Swap the card to continue.'); }
          else { renderCands(voter.display(5)); setStatus(top ? 'Reading… tap a name below if it is not adding.' : 'Card found, reading its name…'); }
        }
      }
    }
    await sleep(250);
  }
}

/* manual add */
$('#manual').oninput = e => {
  const box = $('#suggest'); box.textContent = '';
  for (const name of suggest(e.target.value)){
    const b = document.createElement('button'); b.textContent = name; b.style.textAlign = 'left';
    b.onclick = () => { requestAdd(name); e.target.value = ''; box.textContent = ''; };
    box.append(b);
  }
};

/* tabs */
function tab(which){
  const scan = which === 'scan';
  $('#scanView').hidden = !scan; $('#collView').hidden = scan;
  $('#tabScan').setAttribute('aria-selected', scan); $('#tabColl').setAttribute('aria-selected', !scan);
  if (!scan) renderList(); else { renderTarget(); layout(); }
}
$('#tabScan').onclick = () => tab('scan'); $('#tabColl').onclick = () => tab('coll');

/* boot */
(async () => {
  const saved = await idb.get('store'); if (saved) store = saved;
  normalizeStore(); renderTarget(); syncToggle();
  renderList(); renderBar(); layout();
  tagdb = (await idb.get('tagdb')) || { byOracle: {} }; tagdb.byOracle ??= {};
  await loadTagFile();
  Object.keys(store.cards).forEach(enqueue);
  Object.values(store.cards).forEach(c => tagWant(c.oracle_id));
  refreshPrices();
  loadCV();
  try {
    await loadCatalog(); catalogReady = true;
    setStatus(`Ready. ${index.length.toLocaleString()} card names loaded.`); updateScanBtn();
  } catch (e) { setStatus('Could not load card names. Check your connection and reload.'); }
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
